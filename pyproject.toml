[project]
name = "reclaim"
version = "0.1.0"
description = "Personal scheduling engine: auto-schedule tasks, defend focus time, flex habits, inject buffers, find mutual time for meetings."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5"]

[project.scripts]
reclaim = "reclaim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reclaim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
