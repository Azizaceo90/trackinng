name: Interview ingest

on:
  schedule:
    - cron: "30 */2 * * *"  # every 2 hours, 30 min past the hour
  workflow_dispatch: {}      # also runnable manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "reclaim/**"
      - ".github/workflows/interview-ingest.yml"

permissions:
  contents: read

concurrency:
  group: interview-ingest
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reclaim
        run: pip install -e .

      - name: Materialize OAuth credentials from secrets
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_REFRESH_TOKEN_PERSONAL2: ${{ secrets.GMAIL_REFRESH_TOKEN_PERSONAL2 }}
          CALENDAR_REFRESH_TOKEN: ${{ secrets.CALENDAR_REFRESH_TOKEN }}
          CALENDAR_REFRESH_TOKEN_PERSONAL2: ${{ secrets.CALENDAR_REFRESH_TOKEN_PERSONAL2 }}
        run: |
          mkdir -p "$HOME/.config/reclaim/tokens"
          # Sanity-check secret presence (length only, never the value).
          echo "=== Secret lengths (empty = missing/wrong name) ==="
          echo "GOOGLE_OAUTH_CLIENT:               ${#GOOGLE_OAUTH_CLIENT}"
          echo "GMAIL_REFRESH_TOKEN:               ${#GMAIL_REFRESH_TOKEN}"
          echo "GMAIL_REFRESH_TOKEN_PERSONAL2:     ${#GMAIL_REFRESH_TOKEN_PERSONAL2}"
          echo "CALENDAR_REFRESH_TOKEN:            ${#CALENDAR_REFRESH_TOKEN}"
          echo "CALENDAR_REFRESH_TOKEN_PERSONAL2:  ${#CALENDAR_REFRESH_TOKEN_PERSONAL2}"
          echo "==================================================="
          printf '%s' "$GOOGLE_OAUTH_CLIENT" > "$HOME/.config/reclaim/gmail_credentials.json"
          printf '{"refresh_token":"%s"}' "$GMAIL_REFRESH_TOKEN" \
            > "$HOME/.config/reclaim/tokens/default.json"
          printf '{"refresh_token":"%s"}' "$GMAIL_REFRESH_TOKEN_PERSONAL2" \
            > "$HOME/.config/reclaim/tokens/personal2.json"
          printf '{"refresh_token":"%s"}' "$CALENDAR_REFRESH_TOKEN" \
            > "$HOME/.config/reclaim/tokens/calendar-default.json"
          printf '{"refresh_token":"%s"}' "$CALENDAR_REFRESH_TOKEN_PERSONAL2" \
            > "$HOME/.config/reclaim/tokens/calendar-personal2.json"
          chmod 600 "$HOME/.config/reclaim/tokens/"*.json
          chmod 600 "$HOME/.config/reclaim/gmail_credentials.json"
          # Confirm each JSON file is non-trivially sized.
          echo "=== Token file sizes (bytes) ==="
          wc -c "$HOME/.config/reclaim/tokens/"*.json "$HOME/.config/reclaim/gmail_credentials.json"

      - name: Scan default Gmail (muhammadaziza732) -> default calendar
        run: |
          python -m reclaim.interviews scan --days 14 \
            --gmail-account default \
            --calendar-account default \
            > report-default.json
          echo "--- default summary ---"
          python -m json.tool report-default.json | head -20

      - name: Scan personal2 Gmail (aziza.muhammadx) -> personal2 calendar
        run: |
          python -m reclaim.interviews scan --days 14 \
            --gmail-account personal2 \
            --calendar-account personal2 \
            > report-personal2.json
          echo "--- personal2 summary ---"
          python -m json.tool report-personal2.json | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-report
          path: report-*.json
          retention-days: 14
