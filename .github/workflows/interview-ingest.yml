name: Interview ingest

on:
  workflow_dispatch: {}      # manual-only; cron disabled
  push:
    branches: [main]
    paths:
      - "reclaim/**"
      - ".github/workflows/interview-ingest.yml"

permissions:
  contents: read

concurrency:
  group: interview-ingest
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reclaim
        run: pip install -e .

      - name: Materialize OAuth credentials from secrets
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_REFRESH_TOKEN_PERSONAL2: ${{ secrets.GMAIL_REFRESH_TOKEN_PERSONAL2 }}
          CALENDAR_REFRESH_TOKEN: ${{ secrets.CALENDAR_REFRESH_TOKEN }}
          CALENDAR_REFRESH_TOKEN_PERSONAL2: ${{ secrets.CALENDAR_REFRESH_TOKEN_PERSONAL2 }}
        run: |
          mkdir -p "$HOME/.config/reclaim/tokens"
          # Strip any whitespace (newline, tab, space) from secret values —
          # GitHub's UI sometimes appends a trailing newline on paste, which
          # produces invalid JSON when embedded in the refresh_token field.
          strip() { printf '%s' "$1" | tr -d '[:space:]'; }
          OAUTH=$(strip "$GOOGLE_OAUTH_CLIENT")
          GMAIL_DEFAULT=$(strip "$GMAIL_REFRESH_TOKEN")
          GMAIL_P2=$(strip "$GMAIL_REFRESH_TOKEN_PERSONAL2")
          CAL_DEFAULT=$(strip "$CALENDAR_REFRESH_TOKEN")
          CAL_P2=$(strip "$CALENDAR_REFRESH_TOKEN_PERSONAL2")
          printf '%s' "$OAUTH" > "$HOME/.config/reclaim/gmail_credentials.json"
          printf '{"refresh_token":"%s"}' "$GMAIL_DEFAULT" \
            > "$HOME/.config/reclaim/tokens/default.json"
          printf '{"refresh_token":"%s"}' "$GMAIL_P2" \
            > "$HOME/.config/reclaim/tokens/personal2.json"
          printf '{"refresh_token":"%s"}' "$CAL_DEFAULT" \
            > "$HOME/.config/reclaim/tokens/calendar-default.json"
          printf '{"refresh_token":"%s"}' "$CAL_P2" \
            > "$HOME/.config/reclaim/tokens/calendar-personal2.json"
          chmod 600 "$HOME/.config/reclaim/tokens/"*.json
          chmod 600 "$HOME/.config/reclaim/gmail_credentials.json"
          # Verify each token file parses as JSON before scan steps run.
          for f in "$HOME/.config/reclaim/tokens/"*.json \
                   "$HOME/.config/reclaim/gmail_credentials.json"; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print('OK', sys.argv[1])" "$f"
          done

      - name: Scan default Gmail (muhammadaziza732) -> default calendar
        run: |
          python -m reclaim.interviews scan --days 14 \
            --gmail-account default \
            --calendar-account default \
            > report-default.json
          echo "--- default summary ---"
          python -m json.tool report-default.json | head -20

      - name: Scan personal2 Gmail (aziza.muhammadx) -> personal2 calendar
        run: |
          python -m reclaim.interviews scan --days 14 \
            --gmail-account personal2 \
            --calendar-account personal2 \
            > report-personal2.json
          echo "--- personal2 summary ---"
          python -m json.tool report-personal2.json | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-report
          path: report-*.json
          retention-days: 14
