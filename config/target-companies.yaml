    outreach_template: |
      Subject: Industrial tenant identification before the RFP hits

      Hi {firstname},

      The margin in industrial tenant rep / data center brokerage compresses
      to 1-2% the moment an RFP goes public. Everyone competes on price after
      that.

      Our system identifies corporate tenants in tech/healthcare 60-90 days
      BEFORE they post the RFP — based on hiring patterns, public real estate
      filings, supply chain announcements, and capacity disclosures. Lets your
      brokers walk in pre-RFP with the right asset.

      One specialty broker used this to land 3 100K-sq-ft+ deals last year
      that wouldn't have come through normal channels. Worth 15 min?

      {yourname}
