# Curated target companies per capital-rich vertical.
# Diversified across 10 verticals in 6 industries (finance, healthcare,
# real estate, legal, hospitality, insurance, industrial, luxury).
# Pre-researched starting points — verify currency before outreach.

target_companies:

  # --------------------------------------------------------------- FINANCE
  - vertical: "Boutique M&A / lower-mid market"
    industry: "Finance"
    typical_net_margin: "30-50% (partnership profit-per-partner basis)"
    typical_deal_size: "$5M-$50M transactions; $250K-$2M advisory fees per mandate"
    description: >
      M&A advisory firms outside the bulge bracket. Source mandates through
      senior banker relationships, conferences, and golf. AI-augmented
      outbound is genuinely novel here.
    companies:
      - name: Houlihan Lokey
        size: "~2,500 staff, public (HLI)"
        why_fit: "Strong middle-market focus; mandate volume large enough to feel pipeline gaps."
        decision_makers: "MDs by sector — search LinkedIn 'Houlihan Lokey Managing Director'."
      - name: William Blair
        size: "~2,000 staff, private partnership"
        why_fit: "Growth-company M&A; partners feel origination pressure personally."
      - name: Lincoln International
        size: "~1,000 globally, private"
        why_fit: "Mid-market specialist; each MD has personal mandate quota."
      - name: Harris Williams
        size: "~400 bankers, owned by PNC"
        why_fit: "Pure middle-market; managing partner level cares about origination throughput."
      - name: Capstone Partners
        size: "~250 bankers, multi-office US"
        why_fit: "Lower-middle market explicitly. Smaller team = each banker's origination matters more."
      - name: Cascadia Capital
        size: "~200 bankers, US-focused"
        why_fit: "Pacific NW based; tech + consumer focus."
      - name: D.A. Davidson Investment Banking
        size: "~150 bankers"
        why_fit: "Smaller boutique with sector-aligned MDs."
    outreach_template: |
      Subject: 30 seconds — adjacent firm filled a 2024 mandate gap

      Hi {firstname},

      Most {vertical} firms hit the same constraint: MD-led origination
      is at capacity 90% of the year, leaving 10-15% of deal capacity unused.

      A peer firm used AI-augmented outbound to identify decision-makers
      at 200 sellers in their target sectors over 90 days. Closed 2
      mandates worth $250K+ each.

      Worth 15 min to share what specifically worked?

      {yourname}

  - vertical: "Private wealth / RIA"
    industry: "Finance"
    typical_net_margin: "25-40% (operating margin, scales with AUM)"
    typical_deal_size: "$25K-$150K annual recurring fee per HNW household; $5M+ AUM minimum"
    description: >
      RIAs managing HNWI/UHNWI portfolios. Acquire via referrals from CPAs
      and estate attorneys. Modern outbound to identify $5M+ liquidity
      events = unfair advantage.
    companies:
      - name: Mercer Advisors
        size: "~$60B AUM"
        why_fit: "PE-backed, aggressive acquisitive RIA."
      - name: Creative Planning
        size: "~$200B AUM"
        why_fit: "PE-backed; regional MDs land institutional clients."
      - name: Mariner Wealth Advisors
        size: "~$140B AUM"
        why_fit: "Regional offices want HNW pipeline."
      - name: Beacon Pointe Advisors
        size: "~$36B AUM"
        why_fit: "PE-backed roll-up; partners get AUM growth scorecards."
      - name: Hightower
        size: "~$160B AUM"
        why_fit: "RIA aggregator; regional MDs have AUM quotas."
      - name: Cresset Capital
        size: "~$50B AUM"
        why_fit: "MFO targeting families with $25M+ liquid."
      - name: Wealth Enhancement Group
        size: "~$90B AUM"
        why_fit: "PE-backed (TA Associates); aggressive organic + M&A growth."
    outreach_template: |
      Subject: Identifying $5M+ liquidity events before they happen

      Hi {firstname},

      Most RIAs rely on attorneys + CPAs for HNW referrals. The problem
      isn't quality, it's timing — you find out about the liquidity event
      after 2-3 competitor advisors are already at the kitchen table.

      A peer firm used AI-augmented signals (SEC Form 4, M&A filings, IPO
      lockup expirations) to identify ~15 $5M+ events/month before
      anyone's referral network. Closed 4 new households at $1M+ in 6 mo.

      15-min call — no pitch.

      {yourname}

  # --------------------------------------------------------------- HEALTHCARE
  - vertical: "Dental Support Organizations (DSOs) / specialty surgery centers"
    industry: "Healthcare"
    typical_net_margin: "15-25% (EBITDA margin; PE-backed roll-ups push toward 25%+)"
    typical_deal_size: "$2M-$15M EBITDA practice acquisitions; 5-9x EBITDA multiples"
    description: >
      DSOs and ASCs are PE-backed roll-ups acquiring practices. Sourcing
      $5M+ practices for acquisition is currently broker-relationship-led
      and slow. AI-augmented identification of practices ready to sell
      (age of owner-dentist, EBITDA inflection, geographic concentration)
      is a real edge.
    companies:
      - name: Heartland Dental
        size: "~1,800+ offices, KKR-backed"
        why_fit: "Largest US DSO. M&A team has explicit acquisition quotas."
      - name: Aspen Dental
        size: "~1,000 offices"
        why_fit: "Aggressive expansion; affiliate-acquisition machine."
      - name: Pacific Dental Services
        size: "~900 offices"
        why_fit: "Private; growth via affiliated practices."
      - name: Smile Brands
        size: "~700 offices"
        why_fit: "Bain Capital-backed; growth pressure."
      - name: USPI (US Physical Therapy)
        size: "~600 ASCs, owned by Tenet"
        why_fit: "ASC roll-up; corporate development team."
      - name: SCA Health (Surgery Care Affiliates)
        size: "~320 ASCs, owned by Optum"
        why_fit: "Largest ASC operator. Acquisition pipeline ALWAYS open."
      - name: AmSurg / Envision
        size: "~250 ASCs"
        why_fit: "PE-owned (KKR); growth via affiliation."
    outreach_template: |
      Subject: Identifying $5M+ EBITDA practices 90 days before broker sees them

      Hi {firstname},

      DSO acquisition pipelines depend heavily on practice brokers, which
      means by the time you see the deal, 3 competitors are bidding.

      A peer DSO uses owner-age + practice-financial signals (state board
      filings, NPI patterns, claims-volume changes via 837 data sources)
      to identify practices likely to sell BEFORE the owner calls a broker.
      Closed 3 acquisitions last year at 1.2-1.5x average market multiple
      (because they were proprietary, not auctioned).

      15-min call to compare notes on origination?

      {yourname}

  - vertical: "Concierge medicine / longevity clinics"
