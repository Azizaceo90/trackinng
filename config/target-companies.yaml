      Identifying corporate tenants BEFORE the RFP gets posted is the lever.
    companies:
      - name: JLL (Industrial & Logistics, Data Center)
        size: "Global CRE giant"
        why_fit: "Specialty teams have margin pressure as logistics commoditizes."
      - name: CBRE (Industrial, Data Center Solutions)
        size: "Global CRE leader"
        why_fit: "Data center brokerage is one of CBRE's fastest-growing units."
      - name: Cushman & Wakefield
        size: "Global CRE"
        why_fit: "Specialty group practice leaders feel commodification."
      - name: Newmark
        size: "Global CRE, public (NMRK)"
        why_fit: "Smaller than the big 3, more agile, growth-focused."
      - name: Colliers International
        size: "Global"
        why_fit: "Specialty teams (life sciences, industrial) have aggressive growth targets."
      - name: Avison Young
        size: "Global, partnership"
        why_fit: "Partnership structure = local market leads feel pipeline pressure personally."
      - name: Stream Realty Partners
        size: "US, ~1,400 staff"
