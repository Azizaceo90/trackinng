    typical_deal_size: "$5K-$25K/year/member; $50K-$250K LTV per UHNW patient"
    description: >
      Premium medical practices charging $5K-$25K/year per member. Source
      patients via referrals + word-of-mouth. AI-augmented outreach to
      HNWIs in target ZIP codes (esp. post-liquidity-event) is essentially
      not done at scale anywhere.
    companies:
      - name: Forward
        size: "~$200/mo subscription, multi-city"
        why_fit: "Direct-to-consumer concierge; growth team explicit."
      - name: MDVIP
        size: "~1,000+ affiliated physicians"
        why_fit: "Largest concierge medicine network; affiliate growth."
      - name: One Medical (Amazon)
        size: "~250+ offices"
        why_fit: "Premium membership tier; corporate development team."
      - name: Crossover Health
        size: "Tech-focused concierge"
        why_fit: "Mostly enterprise contracts but expanding consumer."
      - name: Equinox Optimize (longevity arm)
        size: "Premium fitness + longevity"
        why_fit: "Targeting UHNW; need lead pipeline beyond gym members."
      - name: Function Health
        size: "Premium diagnostics subscription"
        why_fit: "DTC; aggressive growth, sales pipeline."
      - name: Fountain Life
        size: "Longevity clinic, multi-site"
        why_fit: "$25K+ membership; need HNW pipeline."
    outreach_template: |
      Subject: HNW patient acquisition without the country-club circuit

      Hi {firstname},

