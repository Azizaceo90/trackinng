habits:
  # Work-context only. Personal habits (Sleep, prayers, Skincare, Gym, Run, Bike,
  # Lunch, Plan the day, Weekly review, Asata, Asian Meal Prep, mentors, Islamic
  # studies, etc.) are managed directly on the Personal calendar — the planner
  # should not write them or it produces duplicates across both calendars.
  - id: optum-thursday
    title: Optum
    duration: 30m
    days: [thu]
    ideal_window: { start: "13:30", end: "14:00" }
    priority: P1

  - id: management-call-monday
    title: Management call
    duration: 1h
    days: [mon]
    ideal_window: { start: "10:00", end: "11:00" }
    priority: P1

  - id: job-hunt-review
    title: "🎯 Weekly job-hunt review"
    duration: 30m
    days: [fri]
    ideal_window: { start: "16:00", end: "16:30" }
    priority: P1
